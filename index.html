<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>学霸奇遇记 · 小学生智能辅导冒险</title>
<!-- 关键模块预下载（type=module 默认 defer，preload 让 HTTP 阶段并发拉取）-->
<link rel="modulepreload" href="/static/app/main.js" />
<link rel="modulepreload" href="/static/app/ui.js" />
<link rel="modulepreload" href="/static/app/audio.js" />
<link rel="modulepreload" href="/static/app/fx.js" />
<link rel="modulepreload" href="/static/app/state.js" />
<link rel="modulepreload" href="/static/app/engines/base.js" />
<link rel="modulepreload" href="/static/app/engines/battle.js" />
<style>
/* ============== 主题变量（从原 index.html 保留） ============== */
:root{
  --c-bg1:#0f1227;--c-bg2:#1a1f4a;--c-bg3:#2d1f5a;
  --c-panel:rgba(22,26,60,.82);--c-panel-solid:#1b204f;
  --c-accent:#ffcf4b;--c-accent2:#ff7ac3;--c-good:#6cf0a1;--c-bad:#ff6b6b;
  --c-text:#f3f4ff;--c-muted:#a9adda;--c-ink:#141644;
  --grad-sky:linear-gradient(180deg,#2b1b6a 0%,#5e3fa6 50%,#ff9a8b 100%);
  --shadow-lg:0 18px 50px rgba(0,0,0,.45);--shadow-md:0 8px 24px rgba(0,0,0,.3);
  --radius:18px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%;overflow:auto;background:linear-gradient(180deg,#0f1227,#1a1f4a)}
body{
  font-family:"PingFang SC","Microsoft YaHei","HarmonyOS Sans",system-ui,sans-serif;
  color:var(--c-text);
  font-size:16px;
}

/* ============== 模块化骨架与三引擎 CSS ============== */
#topbar{position:fixed;top:0;left:0;right:0;height:44px;background:rgba(20,22,68,.92);display:flex;align-items:center;justify-content:space-between;padding:0 12px;z-index:100;backdrop-filter:blur(8px)}
#topbar .tb-left,#topbar .tb-right{display:flex;gap:10px;align-items:center;font-size:13px}
#topbar .btn-mini{background:#2a306f;color:#fff;border:0;border-radius:10px;padding:6px 10px;font-size:13px;cursor:pointer}
#topbar .btn-mini:hover{background:#3a4090}
#home{padding:60px 20px 20px;max-width:520px;margin:0 auto;color:var(--c-text)}
.home-title{font-size:28px;text-align:center;margin:14px 0 24px;color:var(--c-accent);text-shadow:0 2px 8px rgba(0,0,0,.4)}
.ls-row{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:12px 0;padding:8px 12px;background:var(--c-panel);border-radius:14px}
.ls-row>span{font-size:14px;color:var(--c-muted);min-width:48px}
.ls-btn{padding:8px 12px;border-radius:10px;border:1px solid #3a4090;background:#1a204c;color:#fff;cursor:pointer;font-size:13px;transition:all .15s}
.ls-btn.active{background:var(--c-accent);color:#000;border-color:var(--c-accent);font-weight:bold}
.ls-btn:hover:not(.active):not(.disabled){background:#252b6e}
.ls-btn.disabled{opacity:.32;cursor:not-allowed;background:#15183a;color:#5a6090;border-color:#222850;text-decoration:line-through}
.btn-start{display:block;width:100%;margin-top:24px;padding:14px;background:linear-gradient(90deg,var(--c-accent),var(--c-accent2));border:0;border-radius:16px;color:#000;font-size:18px;font-weight:bold;cursor:pointer;box-shadow:var(--shadow-md)}
.btn-start:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg)}
#pet-area{padding:14px;text-align:center}
.pet-emoji{font-size:48px}
.pet-name{font-size:16px;color:var(--c-accent);margin-top:4px}
.pet-bar{width:200px;height:8px;background:#2a306f;border-radius:8px;margin:6px auto;overflow:hidden}
.pet-bar-fill{height:100%;background:linear-gradient(90deg,var(--c-good),var(--c-accent));transition:width .3s}
.pet-exp{font-size:12px;color:var(--c-muted)}

#stage{position:fixed;top:0;left:0;right:0;bottom:0;background:var(--grad-sky);z-index:50;display:none;overflow:auto;padding:50px 0 0;contain:layout paint}
#stage.show{display:block}
.btn-stage-back{position:fixed;top:50px;left:8px;z-index:60;background:rgba(0,0,0,.6);color:#fff;border:0;border-radius:10px;padding:8px 12px;cursor:pointer}

/* Battle */
.battle{padding:14px;display:flex;flex-direction:column;width:100%;max-width:720px;margin:0 auto;box-sizing:border-box;min-height:calc(100vh - 60px)}
.battle .battle-top{display:flex;align-items:center;margin-bottom:14px;gap:14px}
.battle .hp-bar{flex:1;font-size:12px;min-width:0}
.battle .hp-track{width:100%;height:14px;background:#2a306f;border-radius:14px;overflow:hidden;margin-top:4px}
.battle .hp-fill{height:100%;background:linear-gradient(90deg,var(--c-good),var(--c-accent));transition:width .3s}
.battle .hp-bar.boss .hp-fill{background:linear-gradient(90deg,var(--c-bad),#ff9a3d)}
.battle .combo{font-size:13px;color:var(--c-accent);text-align:center;flex:0 0 auto;min-width:70px}
.battle .arena{flex:0 0 180px;display:flex;justify-content:space-around;align-items:center;position:relative;margin:0 0 14px;background:rgba(0,0,0,.25);border-radius:18px;padding:0 24px}
.battle .arena .hero,.battle .arena .boss{font-size:60px;text-shadow:0 4px 12px rgba(0,0,0,.5);line-height:1}
.battle .qbox{flex:1;background:var(--c-panel);border-radius:18px;padding:16px;min-height:200px}
.battle .q-text{font-size:18px;text-align:center;margin-bottom:14px;line-height:1.5;font-weight:500}
.battle .q-options{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.battle .q-opt{padding:14px;background:#252b6e;color:#fff;border:0;border-radius:12px;font-size:15px;cursor:pointer;transition:all .15s;min-height:48px}
.battle .q-opt:hover{background:var(--c-accent);color:#000}
.battle .q-opt.answered{cursor:default;pointer-events:none;opacity:.72}
.battle .q-opt.selected{opacity:1;transform:translateY(-2px) scale(1.03);box-shadow:0 0 0 3px rgba(255,255,255,.25)}
.battle .q-opt.correct{background:linear-gradient(135deg,#2fd36b,#139d4d);color:#06150c}
.battle .q-opt.wrong{background:linear-gradient(135deg,#ff5a5f,#b71c35);color:#fff}
.battle .q-input.correct{border-color:#2fd36b;box-shadow:0 0 0 3px rgba(47,211,107,.22)}
.battle .q-input.wrong{border-color:#ff5a5f;box-shadow:0 0 0 3px rgba(255,90,95,.22)}
.battle .q-input{width:100%;padding:12px;background:#1a204c;border:1px solid #3a4090;border-radius:10px;color:#fff;font-size:16px;margin-bottom:8px;box-sizing:border-box}
.battle .q-actions,.fighting .ft-actions{display:flex;gap:8px;justify-content:center;margin-top:14px}
.battle .btn-mini,.shooting .btn-mini,.fighting .btn-mini{background:#2a306f;color:#fff;border:0;border-radius:10px;padding:8px 14px;font-size:13px;cursor:pointer}
.battle .hint-bubble{position:absolute;bottom:30%;left:50%;transform:translateX(-50%);background:rgba(255,255,255,.95);color:#000;padding:10px 16px;border-radius:14px;font-size:14px;animation:bubble-pop .3s ease-out;max-width:80%;box-shadow:var(--shadow-md)}
.projectile{position:fixed;font-size:32px;z-index:200;pointer-events:none}
@keyframes bubble-pop{0%{opacity:0;transform:translateX(-50%) scale(.5)}100%{opacity:1;transform:translateX(-50%) scale(1)}}

/* Shooting */
.shooting{padding:14px;display:flex;flex-direction:column;width:100%;max-width:720px;margin:0 auto;box-sizing:border-box;min-height:calc(100vh - 60px);background:linear-gradient(180deg,#0a1226,#1a2050)}
.shooting .sh-top{display:flex;justify-content:space-between;font-size:13px;background:rgba(0,0,0,.4);padding:10px 14px;border-radius:14px;margin-bottom:12px;gap:10px;flex-wrap:wrap}
.shooting .sh-top>div{flex:1;text-align:center;min-width:80px}
.shooting .sh-arena{flex:1;min-height:380px;position:relative;background:rgba(0,0,0,.25);border-radius:18px;overflow:hidden}
.shooting .sh-monsters{position:absolute;inset:0}
.shooting .sh-monster{position:absolute;font-size:32px;transition:right .35s,opacity .3s}
.shooting .sh-monster.killed{transform:scale(1.5);opacity:0}
.shooting .sh-monster.breached{filter:hue-rotate(120deg);opacity:.5}
.shooting .sh-q{position:absolute;left:50%;top:30%;transform:translate(-50%,-50%);background:rgba(255,255,255,.18);padding:12px 18px;border-radius:14px;font-size:16px;backdrop-filter:blur(6px);text-align:center;max-width:90%;line-height:1.4;font-weight:500;color:#fff}
.shooting .sh-tts{position:absolute;right:12px;top:12px;z-index:2}
.shooting .sh-targets{position:absolute;inset:0}
.shooting .sh-target{position:absolute;padding:10px 14px;background:linear-gradient(135deg,#ffaa44,#ff6633);color:#fff;border:0;border-radius:30px;cursor:pointer;font-size:13px;font-weight:bold;box-shadow:0 4px 12px rgba(255,100,0,.4);min-width:54px;min-height:60px;max-width:44%;line-height:1.25;text-align:center;white-space:normal;word-break:break-word;overflow:hidden;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;transform:translate(-50%,-50%);animation:pulse 2s infinite}
.shooting .sh-target:hover{transform:translate(-50%,-50%) scale(1.1);z-index:3}
.shooting .sh-target.answered{cursor:default;pointer-events:none;animation:none;opacity:.55}
.shooting .sh-target.selected{opacity:1;transform:translate(-50%,-50%) scale(1.14);box-shadow:0 0 0 4px rgba(255,255,255,.28),0 8px 22px rgba(0,0,0,.35);z-index:4}
.shooting .sh-target.correct{background:linear-gradient(135deg,#38e27c,#0e9f4d)}
.shooting .sh-target.wrong{background:linear-gradient(135deg,#ff5a5f,#b71c35)}
@keyframes pulse{0%,100%{box-shadow:0 4px 12px rgba(255,100,0,.4)}50%{box-shadow:0 4px 20px rgba(255,150,50,.7)}}
.shooting .sh-defense{color:var(--c-bad)}
.shooting .sh-score-n.sh-score-pop{display:inline-block;animation:score-pop .55s cubic-bezier(.34,1.6,.64,1);color:var(--c-accent);text-shadow:0 0 12px rgba(255,207,75,.7)}
@keyframes score-pop{0%{transform:scale(1)}30%{transform:scale(1.6) rotate(-6deg)}55%{transform:scale(.95) rotate(3deg)}100%{transform:scale(1) rotate(0)}}

/* Fighting */
.fighting{padding:14px;display:flex;flex-direction:column;width:100%;max-width:720px;margin:0 auto;box-sizing:border-box;min-height:calc(100vh - 60px);background:linear-gradient(180deg,#1a0d28,#3a1845)}
.fighting .ft-top{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.fighting .ft-bar{flex:1;font-size:11px;min-width:0}
.fighting .ft-bar.boss{text-align:right}
.fighting .ft-track{width:100%;height:14px;background:#1a0530;border:2px solid #ffcf4b;border-radius:14px;overflow:hidden;margin-top:2px}
.fighting .ft-fill{height:100%;background:linear-gradient(90deg,var(--c-good),var(--c-accent));transition:width .3s}
.fighting .ft-bar.boss .ft-fill{background:linear-gradient(90deg,var(--c-bad),#ff9a3d)}
.fighting .ft-vs{font-size:18px;color:var(--c-accent);font-weight:bold;flex:0 0 auto}
.fighting .ft-arena{flex:0 0 180px;display:flex;justify-content:space-between;align-items:center;position:relative;background:rgba(0,0,0,.3);border-radius:18px;padding:0 24px;margin-bottom:12px}
.fighting .ft-hero,.fighting .ft-boss{font-size:78px;text-shadow:0 6px 16px rgba(0,0,0,.6)}
.fighting .ft-hero.hit,.fighting .ft-boss.hit{animation:shake .2s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.fighting .ft-boss.phase-2{filter:hue-rotate(-30deg) brightness(1.1)}
.fighting .ft-boss.phase-3{filter:hue-rotate(-60deg) brightness(1.2) saturate(1.5);animation:rage 1s infinite}
@keyframes rage{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
.fighting .ft-fx-layer{position:absolute;inset:0;pointer-events:none}
.fighting .ft-big-text{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);font-size:36px;font-weight:bold;color:var(--c-accent);text-shadow:0 4px 16px rgba(0,0,0,.8);animation:big-text 1.5s ease-out forwards;white-space:nowrap}
@keyframes big-text{0%{opacity:0;transform:translate(-50%,-50%) scale(.3)}30%{opacity:1;transform:translate(-50%,-50%) scale(1.2)}70%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-50%) scale(.8)}}
.fighting .ft-combo{text-align:center;font-size:14px;color:var(--c-accent);margin-bottom:8px}
.fighting .ft-q{background:var(--c-panel);padding:14px;border-radius:14px;font-size:16px;text-align:center;margin-bottom:10px;line-height:1.5;font-weight:500}
.fighting .ft-moves{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fighting .ft-move{padding:12px;background:linear-gradient(135deg,#3a1845,#5e3fa6);color:#fff;border:2px solid var(--c-accent);border-radius:14px;cursor:pointer;display:flex;flex-direction:column;gap:2px;text-align:center;min-height:60px;align-items:center;justify-content:center}
.fighting .ft-move:hover{background:linear-gradient(135deg,#5e3fa6,#7a5fc6)}
.fighting .ft-move.answered{cursor:default;pointer-events:none;opacity:.62}
.fighting .ft-move.selected{opacity:1;transform:translateY(-2px);box-shadow:0 0 0 3px rgba(255,255,255,.24)}
.fighting .ft-move.correct{background:linear-gradient(135deg,#1f9e55,#40dd77);border-color:#87ffad;color:#03150b}
.fighting .ft-move.wrong{background:linear-gradient(135deg,#b71c35,#ff5a5f);border-color:#ff9ca3;color:#fff}
.fighting .ft-move-k{font-size:18px;font-weight:bold;color:var(--c-accent)}
.fighting .ft-move-l{font-size:11px;color:var(--c-muted)}
.fighting .ft-move-o{font-size:14px}

/* ============== 响应式: 平板 (≥768px) ============== */
@media (min-width: 768px) {
  #home{max-width:680px;padding:60px 28px 28px}
  .home-title{font-size:32px}
  .ls-row{padding:10px 14px}
  .ls-btn{padding:9px 14px;font-size:14px}
  .battle, .shooting, .fighting{max-width:760px;padding:18px}
  .battle .arena, .fighting .ft-arena{flex-basis:220px}
  .battle .arena .hero, .battle .arena .boss{font-size:74px}
  .fighting .ft-hero, .fighting .ft-boss{font-size:96px}
  .battle .q-text{font-size:20px}
  .fighting .ft-q{font-size:18px}
  .battle .q-options{grid-template-columns:1fr 1fr;gap:12px}
  .battle .q-opt{font-size:16px;min-height:56px}
  .fighting .ft-moves{grid-template-columns:1fr 1fr;gap:12px}
  .fighting .ft-move{min-height:72px}
}

/* ============== 响应式: 桌面 (≥1024px) ============== */
@media (min-width: 1024px) {
  #stage{padding:60px 0 0}
  .btn-stage-back{top:60px;left:16px}
  .battle, .shooting, .fighting{max-width:860px;padding:24px}
  .battle .battle-top, .fighting .ft-top{gap:24px}
  .battle .arena, .fighting .ft-arena{flex-basis:260px}
  .battle .arena .hero, .battle .arena .boss{font-size:90px}
  .fighting .ft-hero, .fighting .ft-boss{font-size:110px}
  .battle .q-text{font-size:22px}
  .fighting .ft-q{font-size:20px;padding:18px}
  .battle .q-options{grid-template-columns:repeat(4, 1fr);gap:14px}
  .battle .q-opt{font-size:17px;min-height:64px}
  .fighting .ft-moves{grid-template-columns:repeat(4, 1fr);gap:14px}
  .fighting .ft-move{min-height:88px}
  .fighting .ft-move-k{font-size:22px}
  .fighting .ft-move-l{font-size:12px}
  .fighting .ft-move-o{font-size:16px}
  .shooting .sh-arena{min-height:480px}
  .shooting .sh-q{font-size:20px}
  .shooting .sh-target{font-size:16px;min-width:64px;min-height:64px}
}

/* ============== 响应式: 大桌面 (≥1440px) ============== */
@media (min-width: 1440px) {
  .battle, .shooting, .fighting{max-width:960px}
}

/* ============== 响应式: 小手机 (<360px) ============== */
@media (max-width: 359px) {
  .battle, .shooting, .fighting{padding:10px}
  .battle .battle-top, .fighting .ft-top{gap:8px}
  .battle .arena .hero, .battle .arena .boss, .fighting .ft-arena .ft-hero, .fighting .ft-arena .ft-boss{font-size:48px}
  .battle .q-text, .fighting .ft-q{font-size:15px}
  .battle .q-opt, .fighting .ft-move{padding:10px;font-size:13px}
  .fighting .ft-vs{font-size:14px}
}

/* Toast */
#toast-wrap{position:fixed;top:60px;left:50%;transform:translateX(-50%);z-index:1000;display:flex;flex-direction:column;gap:6px;pointer-events:none}
.toast{background:rgba(0,0,0,.85);color:#fff;padding:10px 16px;border-radius:14px;font-size:14px;animation:toast-in .25s ease-out;backdrop-filter:blur(8px)}
@keyframes toast-in{0%{opacity:0;transform:translateY(-10px)}100%{opacity:1;transform:translateY(0)}}

/* Confirm */
#confirm-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:1100;display:none;align-items:center;justify-content:center;backdrop-filter:blur(4px)}
#confirm-overlay.show{display:flex}
.confirm-panel{background:var(--c-panel-solid);border-radius:18px;padding:24px;max-width:340px;width:80%;text-align:center;box-shadow:var(--shadow-lg)}
#confirm-icon{font-size:40px;margin-bottom:8px}
#confirm-title{font-size:18px;margin-bottom:8px;color:var(--c-accent)}
#confirm-msg{font-size:14px;color:var(--c-muted);margin-bottom:16px;white-space:pre-line}
#confirm-overlay .btn{padding:10px 20px;border:0;border-radius:12px;font-size:14px;cursor:pointer;margin:0 6px}
#confirm-overlay .btn-danger{background:var(--c-bad);color:#fff}
#confirm-overlay .btn-cancel{background:#252b6e;color:#fff}

/* Particle */
.particle{position:fixed;font-size:24px;z-index:200;pointer-events:none;animation:particle-up 1s ease-out forwards}
@keyframes particle-up{0%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(-80px)}}

/* ============== 街机打击感（fx-* utility classes） ============== */

/* Hitstop — 短暂凝帧（动画暂停） */
.fx-hitstop *{animation-play-state:paused !important;transition:none !important}

/* 屏幕震动 */
@keyframes shake-light{0%,100%{transform:translate(0,0)}25%{transform:translate(-2px,2px)}50%{transform:translate(2px,-1px)}75%{transform:translate(-1px,2px)}}
@keyframes shake-medium{0%,100%{transform:translate(0,0)}10%{transform:translate(-4px,3px)}30%{transform:translate(5px,-2px)}50%{transform:translate(-3px,4px)}70%{transform:translate(3px,-3px)}90%{transform:translate(-2px,2px)}}
@keyframes shake-heavy{0%,100%{transform:translate(0,0)}10%{transform:translate(-8px,4px) rotate(-.4deg)}25%{transform:translate(8px,-4px) rotate(.4deg)}40%{transform:translate(-7px,5px) rotate(-.3deg)}55%{transform:translate(6px,-3px) rotate(.3deg)}70%{transform:translate(-4px,3px)}85%{transform:translate(3px,-2px)}}
.fx-shake-light{animation:shake-light .25s}
.fx-shake-medium{animation:shake-medium .35s}
.fx-shake-heavy{animation:shake-heavy .5s}

/* 全屏闪光 — 去掉 mix-blend-mode: overlay（每帧都要走合成器混合，低端机贵），改纯 alpha */
.fx-flash{position:fixed;inset:0;background:#fff;z-index:9999;pointer-events:none;animation:flash-fade .12s ease-out forwards;will-change:opacity}
@keyframes flash-fade{0%{opacity:.55}100%{opacity:0}}

/* 慢镜头（动画速率减半） */
.fx-slowmo *{animation-duration:1.8s !important;transition-duration:.5s !important}

/* 伤害浮字 */
.fx-damage{position:fixed;font-size:28px;font-weight:900;color:#ffcf4b;text-shadow:0 0 6px #000,2px 2px 0 #000,-2px 2px 0 #000,2px -2px 0 #000,-2px -2px 0 #000;z-index:300;pointer-events:none;animation:dmg-rise 1s cubic-bezier(.17,.67,.21,1) forwards}
.fx-damage.crit{font-size:42px;color:#ff4444;text-shadow:0 0 8px #ff0,2px 2px 0 #000,-2px 2px 0 #000,2px -2px 0 #000,-2px -2px 0 #000;animation:dmg-rise-crit 1.2s cubic-bezier(.17,.67,.21,1) forwards}
.fx-damage.heal{color:#6cf0a1}
@keyframes dmg-rise{0%{opacity:0;transform:translate(-50%,0) scale(.5)}15%{opacity:1;transform:translate(-50%,-10px) scale(1.3)}30%{transform:translate(-50%,-30px) scale(1)}100%{opacity:0;transform:translate(-50%,-90px) scale(.9)}}
@keyframes dmg-rise-crit{0%{opacity:0;transform:translate(-50%,0) scale(.3) rotate(-15deg)}15%{opacity:1;transform:translate(-50%,-15px) scale(1.7) rotate(5deg)}25%{transform:translate(-50%,-30px) scale(1.4) rotate(-3deg)}40%{transform:translate(-50%,-50px) scale(1.2) rotate(0)}100%{opacity:0;transform:translate(-50%,-110px) scale(1)}}

/* 粒子飞溅 */
.fx-spark{position:fixed;font-size:20px;font-weight:bold;z-index:250;pointer-events:none;animation:spark-fly .7s cubic-bezier(.17,.84,.44,1) forwards;text-shadow:0 0 4px currentColor}
@keyframes spark-fly{0%{opacity:1;transform:translate(0,0) scale(.4)}30%{opacity:1;transform:translate(calc(var(--dx) * .6),calc(var(--dy) * .6)) scale(1.1)}100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(.3)}}

/* 冲击圆环 */
.fx-ring{position:fixed;width:30px;height:30px;border:4px solid #fff;border-radius:50%;z-index:240;pointer-events:none;transform:translate(-50%,-50%);animation:ring-expand .5s ease-out forwards}
@keyframes ring-expand{0%{opacity:1;width:30px;height:30px;border-width:4px}100%{opacity:0;width:160px;height:160px;border-width:1px}}

/* 大字幕 */
.fx-big-text{position:fixed;left:50%;top:38%;transform:translate(-50%,-50%);font-size:54px;font-weight:900;color:#ffcf4b;text-shadow:0 0 12px #000,4px 4px 0 #000,-4px 4px 0 #000,4px -4px 0 #000,-4px -4px 0 #000,0 6px 18px rgba(0,0,0,.8);z-index:400;pointer-events:none;white-space:nowrap;animation:big-pop 1.4s cubic-bezier(.34,1.56,.64,1) forwards;letter-spacing:2px}
.fx-big-text.crit{font-size:78px;color:#ff4040;text-shadow:0 0 16px #ff0,5px 5px 0 #000,-5px 5px 0 #000,5px -5px 0 #000,-5px -5px 0 #000}
@keyframes big-pop{0%{opacity:0;transform:translate(-50%,-50%) scale(.2) rotate(-20deg)}20%{opacity:1;transform:translate(-50%,-50%) scale(1.5) rotate(8deg)}35%{transform:translate(-50%,-50%) scale(1) rotate(-3deg)}55%{transform:translate(-50%,-50%) scale(1.1) rotate(0)}80%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-80%) scale(.9)}}

/* Flinch — 受击元素短暂放大 + 反白 */
.fx-flinch{animation:flinch .28s ease-out;filter:brightness(1.6) saturate(.6)}
.fx-flinch-strong{animation:flinch-strong .3s ease-out;filter:brightness(2) saturate(.3) hue-rotate(-15deg)}
@keyframes flinch{0%{transform:scale(1)}30%{transform:scale(1.18) translateX(-4px)}60%{transform:scale(1.05) translateX(3px)}100%{transform:scale(1)}}
@keyframes flinch-strong{0%{transform:scale(1)}25%{transform:scale(1.3) translateX(-8px) rotate(-3deg)}50%{transform:scale(1.1) translateX(6px) rotate(2deg)}75%{transform:scale(1.15) translateX(-4px) rotate(-1deg)}100%{transform:scale(1)}}

/* 子弹时间投射物 + 尾迹 */
.fx-proj{position:fixed;z-index:280;pointer-events:none;text-shadow:0 0 12px #ffcf4b,0 0 20px #ffcf4b}

/* 拳轨残影 */
.fx-trail{position:fixed;font-size:48px;z-index:260;pointer-events:none;opacity:.6;animation:trail-fade .3s ease-out forwards}
@keyframes trail-fade{0%{opacity:.7;transform:scale(1)}100%{opacity:0;transform:scale(1.6)}}

/* Overlay (errr, wrongbook / photo / settings) */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:1000;display:none;align-items:center;justify-content:center;backdrop-filter:blur(4px);overflow:auto;padding:20px}
.overlay.show{display:flex}
.wb-panel,.ph-panel,.st-panel{background:var(--c-panel-solid);border-radius:18px;padding:20px;max-width:540px;width:100%;max-height:80vh;overflow:auto;color:#fff}
.wb-head,.ph-head,.st-head{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #3a4090;padding-bottom:10px;margin-bottom:14px}
.wb-close,.ph-close,.st-close{background:transparent;border:0;color:#fff;font-size:24px;cursor:pointer}
.wb-list{display:flex;flex-direction:column;gap:8px}
.wb-item{padding:10px;background:#1a204c;border-radius:10px;font-size:14px}
.wb-q{font-size:15px;margin-bottom:4px}
.wb-meta{font-size:12px;color:var(--c-muted)}
.wb-ans{font-size:13px;color:var(--c-good);margin-top:4px}
.wb-del{margin-top:6px;background:var(--c-bad);color:#fff;border:0;padding:4px 10px;border-radius:8px;cursor:pointer;font-size:12px}
.wb-actions{display:flex;gap:10px;justify-content:center;margin-top:16px}
.wb-clear,.wb-practice{background:var(--c-accent);color:#000;border:0;padding:10px 16px;border-radius:12px;cursor:pointer}
.ph-status{padding:10px 0;color:var(--c-muted)}
.ph-q{padding:6px;background:#1a204c;border-radius:8px;margin:4px 0;font-size:13px}
.st-panel label{display:flex;flex-direction:column;gap:4px;margin:10px 0;font-size:13px;color:var(--c-muted)}
.st-panel input{padding:8px;background:#1a204c;border:1px solid #3a4090;border-radius:8px;color:#fff;font-size:14px}
.st-save{margin-top:12px;background:var(--c-accent);color:#000;border:0;padding:10px 18px;border-radius:12px;cursor:pointer;font-weight:bold}

/* ============== Topbar 增强 ============== */
#topbar .tb-pet{display:inline-flex;align-items:center;gap:6px;padding:2px 8px;background:rgba(255,207,75,.12);border:1px solid rgba(255,207,75,.3);border-radius:14px;font-size:12px}
#topbar .tb-pet b{color:var(--c-accent);font-weight:600}
#topbar .tb-mini-bar{display:inline-block;width:42px;height:5px;background:#1a204c;border-radius:6px;overflow:hidden;margin-left:4px;vertical-align:middle}
#topbar .tb-mini-bar>span{display:block;height:100%;background:linear-gradient(90deg,var(--c-good),var(--c-accent));transition:width .35s}
#topbar .tb-streak{color:#ff7a3a;font-weight:bold;font-size:12px}
#topbar .tb-exp,#topbar .tb-gold,#topbar .tb-gem{font-size:12px}

/* ============== 关卡选择 进度提示 ============== */
.ls-prog{padding:8px 14px;background:rgba(0,0,0,.25);border-radius:12px;margin:14px 0 0;font-size:13px;color:var(--c-muted);text-align:center}
.ls-prog b{color:var(--c-accent);font-size:16px;letter-spacing:2px}

/* ============== 关卡结束 豪华页 ============== */
#overlay-result .result-panel{background:linear-gradient(160deg,#241b6c,#1a0d3a 60%,#0a0420);border:2px solid var(--c-accent);border-radius:24px;padding:30px 26px;max-width:440px;width:90%;text-align:center;box-shadow:0 30px 80px rgba(0,0,0,.7),inset 0 0 60px rgba(255,207,75,.1);color:#fff;animation:result-in .5s cubic-bezier(.34,1.56,.64,1)}
#overlay-result .result-panel.lose{border-color:var(--c-bad);box-shadow:0 30px 80px rgba(0,0,0,.7),inset 0 0 60px rgba(255,80,80,.15)}
@keyframes result-in{0%{opacity:0;transform:scale(.4) translateY(40px)}100%{opacity:1;transform:scale(1) translateY(0)}}
.result-emoji{font-size:80px;animation:bob 2s ease-in-out infinite;line-height:1}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.result-title{font-size:28px;font-weight:bold;color:var(--c-accent);margin:6px 0 10px;letter-spacing:2px;text-shadow:0 4px 12px rgba(0,0,0,.4)}
.result-stars{display:flex;justify-content:center;gap:18px;margin:14px 0 6px}
.result-stars .rstar{font-size:54px;color:#3a3060;transition:all .3s;text-shadow:0 0 0 transparent}
.result-stars .rstar.on{color:var(--c-accent)}
.result-stars .rstar.pop{animation:star-pop .55s cubic-bezier(.34,1.6,.64,1);text-shadow:0 0 24px rgba(255,207,75,.8)}
@keyframes star-pop{0%{transform:scale(.2) rotate(-30deg);opacity:0}50%{transform:scale(1.6) rotate(20deg);opacity:1}100%{transform:scale(1) rotate(0)}}
.result-stats{font-size:14px;color:var(--c-muted);margin:8px 0 16px}
.result-stats b{color:var(--c-text)}
.result-rewards{display:flex;justify-content:center;gap:16px;margin:18px 0;padding:16px 12px;background:rgba(0,0,0,.32);border-radius:16px}
.rrew{display:flex;flex-direction:column;align-items:center;gap:2px}
.rrew>span{font-size:32px;filter:drop-shadow(0 4px 8px rgba(0,0,0,.4))}
.rrew>b{font-size:18px;color:var(--c-accent);font-weight:bold}
.rrew>i{font-size:11px;color:var(--c-muted);font-style:normal}
.result-evolve{margin:14px 0;padding:12px 14px;background:linear-gradient(90deg,rgba(255,122,195,.2),rgba(255,207,75,.2));border-radius:14px;font-size:14px;animation:glow-pulse 2s ease-in-out infinite}
.result-evolve b{color:var(--c-accent2);font-size:16px}
@keyframes glow-pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,207,75,.5)}50%{box-shadow:0 0 30px 0 rgba(255,207,75,.5)}}
.result-achv{margin:14px 0;padding:12px;background:rgba(0,0,0,.3);border-radius:14px}
.rachv-title{font-size:13px;color:var(--c-accent);margin-bottom:8px;text-align:left}
.rachv{display:flex;align-items:center;gap:8px;padding:6px 8px;background:rgba(255,207,75,.08);border-radius:10px;margin:4px 0;font-size:13px;animation:slide-in .4s ease-out}
.rachv small{color:var(--c-muted);margin-left:auto;font-size:11px}
@keyframes slide-in{0%{opacity:0;transform:translateX(-20px)}100%{opacity:1;transform:translateX(0)}}
.result-actions{display:flex;gap:10px;margin-top:18px}
.result-actions button{flex:1;padding:12px;font-size:15px;border-radius:14px;border:0;cursor:pointer;font-weight:bold;transition:transform .15s}
.result-actions button:hover{transform:translateY(-2px)}
.result-actions .btn-back{background:#252b6e;color:#fff}
.result-actions .btn-retry{background:linear-gradient(90deg,var(--c-accent),var(--c-accent2));color:#000}

/* ============== 成就页 ============== */
.achv-panel{background:var(--c-panel-solid);border-radius:18px;padding:20px;max-width:680px;width:100%;max-height:82vh;overflow:auto;color:#fff}
.achv-head{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #3a4090;padding-bottom:10px;margin-bottom:14px}
.achv-close{background:transparent;border:0;color:#fff;font-size:24px;cursor:pointer}
.achv-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.achv-card{padding:12px 8px;background:#1a204c;border-radius:14px;text-align:center;border:1px solid #2a306f;transition:all .2s}
.achv-card.unlocked{background:linear-gradient(160deg,rgba(255,207,75,.18),rgba(255,122,195,.12));border-color:var(--c-accent)}
.achv-card.locked{opacity:.55;filter:grayscale(.6)}
.achv-card.unlocked:hover{transform:translateY(-3px);box-shadow:0 8px 22px rgba(255,207,75,.2)}
.achv-ic{font-size:38px;margin-bottom:4px}
.achv-n{font-size:13px;font-weight:bold;color:var(--c-accent)}
.achv-card.locked .achv-n{color:var(--c-muted)}
.achv-d{font-size:11px;color:var(--c-muted);margin-top:2px;line-height:1.3}

/* ============== 每日任务 ============== */
.daily-panel{background:var(--c-panel-solid);border-radius:18px;padding:20px;max-width:480px;width:100%;color:#fff}
.daily-head{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #3a4090;padding-bottom:10px;margin-bottom:14px}
.daily-close{background:transparent;border:0;color:#fff;font-size:24px;cursor:pointer}
.daily-streak{text-align:center;padding:10px;background:linear-gradient(90deg,rgba(255,122,58,.2),rgba(255,207,75,.2));border-radius:12px;margin-bottom:14px;font-size:14px}
.daily-streak b{color:#ff9a4a;font-size:18px}
.daily-list{display:flex;flex-direction:column;gap:10px}
.daily-item{display:flex;align-items:center;gap:12px;padding:12px;background:#1a204c;border-radius:14px}
.daily-item.done{background:linear-gradient(90deg,rgba(108,240,161,.15),#1a204c)}
.daily-info{flex:1}
.daily-l{font-size:14px;font-weight:500;margin-bottom:6px}
.daily-bar{height:6px;background:#0e1133;border-radius:8px;overflow:hidden;margin:4px 0}
.daily-bar>span{display:block;height:100%;background:linear-gradient(90deg,var(--c-good),var(--c-accent));transition:width .4s}
.daily-p{font-size:11px;color:var(--c-muted)}
.daily-claim{padding:8px 14px;border:0;border-radius:10px;cursor:pointer;font-weight:bold;font-size:13px;background:#2a306f;color:#fff;min-width:70px}
.daily-item.done .daily-claim:not([disabled]){background:linear-gradient(90deg,var(--c-accent),var(--c-accent2));color:#000;animation:pulse-glow 1.4s ease-in-out infinite}
.daily-claim[disabled]{cursor:default;opacity:.65}
@keyframes pulse-glow{0%,100%{box-shadow:0 0 0 0 rgba(255,207,75,.5)}50%{box-shadow:0 0 0 8px rgba(255,207,75,0)}}
.daily-tip{margin-top:14px;font-size:12px;color:var(--c-muted);text-align:center;padding:8px;background:rgba(0,0,0,.2);border-radius:10px}

/* ============== 新拍照 UI ============== */
.ph-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.ph-btn{padding:18px 8px;background:linear-gradient(135deg,#252b6e,#1a204c);border:2px solid #3a4090;border-radius:14px;color:#fff;cursor:pointer;text-align:center;transition:all .2s}
.ph-btn:hover{transform:translateY(-2px);border-color:var(--c-accent);background:linear-gradient(135deg,#3a4090,#252b6e)}
.ph-big{font-size:36px}
.ph-t{font-size:14px;font-weight:bold;margin:4px 0 2px}
.ph-d{font-size:11px;color:var(--c-muted)}
.ph-drop{padding:18px;border:2px dashed #3a4090;border-radius:14px;text-align:center;color:var(--c-muted);transition:all .2s;margin-bottom:12px;cursor:pointer}
.ph-drop.drag{border-color:var(--c-accent);background:rgba(255,207,75,.1)}
.ph-tip{font-size:12px;color:var(--c-muted);background:rgba(0,0,0,.2);padding:10px;border-radius:10px;margin-bottom:10px;line-height:1.5}
.ph-demo{display:block;width:100%;padding:10px;background:#252b6e;color:#fff;border:0;border-radius:12px;cursor:pointer;font-size:13px}
.ph-demo:hover{background:#3a4090}

/* ============== 新设置 UI ============== */
.st-section{margin-bottom:16px;padding:14px;background:rgba(0,0,0,.2);border-radius:12px}
.st-section button{margin:8px 0 0}
.st-stitle{font-size:13px;color:var(--c-accent);margin-bottom:10px;font-weight:bold}
.st-presets{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.st-preset{padding:8px 10px;background:#252b6e;color:#fff;border:1px solid #3a4090;border-radius:10px;cursor:pointer;font-size:12px;transition:all .15s}
.st-preset:hover{background:var(--c-accent);color:#000;border-color:var(--c-accent)}
.st-panel select{padding:8px;background:#1a204c;border:1px solid #3a4090;border-radius:8px;color:#fff;font-size:14px;width:100%}
.st-test-ai,.st-test-tts{background:#252b6e;color:#fff;border:0;padding:8px 14px;border-radius:10px;cursor:pointer;font-size:13px}
.st-test-ai:hover,.st-test-tts:hover{background:var(--c-accent);color:#000}
.st-reset{background:var(--c-bad);color:#fff;border:0;padding:8px 14px;border-radius:10px;cursor:pointer;font-size:13px;margin-left:8px}

/* ============== 道具槽（关卡选择页） ============== */
.it-row{flex-wrap:wrap}
.it-row .it-slot{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:12px;border:1px dashed #3a4090;background:#1a204c;color:#fff;cursor:pointer;font-size:13px;transition:all .15s}
.it-row .it-slot.add{color:#7a82c8;font-size:18px;padding:6px 14px;font-weight:bold}
.it-row .it-slot.add:hover{border-color:var(--c-accent);color:var(--c-accent);background:#252b6e}
.it-row .it-slot.active{border-style:solid;border-color:var(--c-accent);background:linear-gradient(90deg,rgba(255,207,75,.18),rgba(255,122,195,.12));color:var(--c-accent)}
.it-row .it-slot.active:hover{filter:brightness(1.2)}
.it-row .it-slot .it-ic{font-size:16px}
.it-row .it-shop-link{color:var(--c-accent);font-size:12px;cursor:pointer;text-decoration:underline;margin-left:auto}

/* ============== 库存选择弹窗 ============== */
.inv-panel{background:var(--c-panel-solid);border-radius:18px;padding:20px;max-width:560px;width:100%;color:#fff;max-height:82vh;overflow:auto}
.inv-head{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #3a4090;padding-bottom:10px;margin-bottom:14px}
.inv-close{background:transparent;border:0;color:#fff;font-size:24px;cursor:pointer}
.inv-tip{font-size:12px;color:var(--c-muted);margin-bottom:12px}
.inv-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.inv-card{padding:12px 8px;background:#1a204c;border:1px solid #2a306f;border-radius:14px;color:#fff;cursor:pointer;transition:all .2s;text-align:center;position:relative}
.inv-card.equipped{border-color:var(--c-accent);background:linear-gradient(160deg,rgba(255,207,75,.18),rgba(255,122,195,.12))}
.inv-card:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(0,0,0,.4)}
.inv-ic{font-size:32px;margin-bottom:4px}
.inv-n{font-size:13px;font-weight:bold;color:var(--c-accent);margin-bottom:2px}
.inv-d{font-size:11px;color:var(--c-muted);line-height:1.4}
.inv-eq{position:absolute;top:6px;right:6px;font-size:10px;background:var(--c-accent);color:#000;padding:2px 6px;border-radius:8px;font-weight:bold}
.inv-empty{padding:30px;text-align:center;color:var(--c-muted);font-size:14px}
.inv-shop-btn{display:block;width:100%;margin-top:14px;padding:10px;background:linear-gradient(90deg,var(--c-accent),var(--c-accent2));color:#000;border:0;border-radius:12px;cursor:pointer;font-weight:bold;font-size:14px}

/* ============== 商店 ============== */
.shop-panel{background:var(--c-panel-solid);border-radius:18px;padding:20px;max-width:760px;width:100%;color:#fff;max-height:85vh;overflow:auto}
.shop-head{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #3a4090;padding-bottom:10px;margin-bottom:14px;gap:12px;flex-wrap:wrap}
.shop-head h2{margin:0}
.shop-bal{font-size:13px;background:rgba(0,0,0,.3);padding:6px 12px;border-radius:12px;color:var(--c-accent);font-weight:bold}
.shop-close{background:transparent;border:0;color:#fff;font-size:24px;cursor:pointer}
.shop-tip{font-size:12px;color:var(--c-muted);margin-bottom:14px;background:rgba(0,0,0,.2);padding:10px;border-radius:10px}
.shop-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.shop-card{padding:14px;background:linear-gradient(160deg,#1a204c,#2a306f);border:1px solid #3a4090;border-radius:14px;display:flex;flex-direction:column;gap:6px;transition:all .2s}
.shop-card:hover{transform:translateY(-2px);box-shadow:0 8px 22px rgba(0,0,0,.4);border-color:var(--c-accent)}
.shop-card.disabled{opacity:.55}
.shop-ic{font-size:36px;text-align:center}
.shop-n{font-size:14px;font-weight:bold;color:var(--c-accent);text-align:center}
.shop-d{font-size:11px;color:var(--c-muted);line-height:1.4;min-height:30px;text-align:center}
.shop-foot{display:flex;align-items:center;gap:6px;margin-top:6px;flex-wrap:wrap;justify-content:space-between}
.shop-p{font-size:12px;background:rgba(0,0,0,.4);padding:4px 8px;border-radius:8px;color:var(--c-accent);font-weight:bold}
.shop-own{font-size:10px;color:var(--c-good);background:rgba(108,240,161,.15);padding:2px 6px;border-radius:6px}
.shop-buy{padding:6px 12px;border:0;border-radius:10px;cursor:pointer;font-weight:bold;font-size:12px;background:linear-gradient(90deg,var(--c-accent),var(--c-accent2));color:#000;flex:0 0 auto}
.shop-buy:disabled{background:#3a4090;color:#7a82c8;cursor:not-allowed}

/* 关卡结果页 — 道具消耗提示 */
.result-items{margin:8px 0;padding:8px 12px;background:rgba(255,207,75,.08);border-radius:10px;font-size:12px;color:var(--c-muted)}

/* ============== 首屏骨架占位 ============== */
.ls-row.sk{opacity:.65}
.sk-bar{display:inline-block;height:18px;min-width:54px;border-radius:10px;background:linear-gradient(90deg,#252b6e 0%,#3a4090 50%,#252b6e 100%);background-size:200% 100%;animation:sk-shimmer 1.4s linear infinite}
@keyframes sk-shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
[data-skeleton="1"] .btn-start[disabled]{opacity:.6;cursor:wait}

/* ============== 无障碍：尊重系统 "减少动效" 偏好 ============== */
@media (prefers-reduced-motion: reduce) {
  /* 关闭所有打击感动画 / 过渡 */
  .fx-shake-light, .fx-shake-medium, .fx-shake-heavy,
  .fx-flash, .fx-damage, .fx-spark, .fx-ring,
  .fx-big-text, .fx-flinch, .fx-flinch-strong,
  .fx-proj, .fx-trail, .particle, .projectile,
  .shooting .sh-monster, .shooting .sh-target,
  .battle .arena .hero, .battle .arena .boss,
  .fighting .ft-hero, .fighting .ft-boss,
  .result-stars .rstar.pop, .result-emoji,
  .daily-claim, .result-evolve {
    animation: none !important;
    transition: none !important;
  }
  /* 全屏闪光 / 粒子 / 圆环 / 拳轨 直接隐藏，避免视觉冲击 */
  .fx-flash, .fx-spark, .fx-ring, .fx-trail, .projectile, .particle { display: none !important; }
  /* slowmo 也回归正常速率 */
  .fx-slowmo * { animation-duration: 0s !important; transition-duration: 0s !important; }
  /* 首屏骨架的 shimmer 也停 */
  .sk-bar { animation: none !important; background: #2d3375 !important; }
}

</style>
</head>
